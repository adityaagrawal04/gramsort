name: Bug report
description: Create a report to help us improve GramSort
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11 / macOS Sonoma / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: export-format
    attributes:
      label: Instagram Export Format
      options:
        - HTML
        - JSON
        - Both / Mixed
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      render: shell
